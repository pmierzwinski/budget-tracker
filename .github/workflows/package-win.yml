name: Paczka Windows

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: Wydatki-Windows
          path: release/Wydatki-Windows.zip
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/Wydatki-Windows.zip
